<!-- @dsCard group="Colors" viewport="700x210" name="Midnight mood — palette" subtitle="True dark. Near-black surfaces, brightened sage + terracotta." -->
<!DOCTYPE html>
<html lang="en" data-mood="midnight">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);padding:22px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .sw{width:96px;}
  .chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--color-border);}
  .nm{font-size:11px;font-weight:600;color:var(--color-text);margin-top:7px;}
  .vl{font-size:10px;color:var(--color-text-muted);font-family:var(--font-mono);}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="nm">bg</div><div class="vl">paper 100</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-surface)"></div><div class="nm">surface</div><div class="vl">card</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="nm">accent</div><div class="vl">sage</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-accent-strong)"></div><div class="nm">accent-strong</div><div class="vl">sage +</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-warm)"></div><div class="nm">warm</div><div class="vl">terracotta</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-text)"></div><div class="nm">text</div><div class="vl">ink 950</div></div>
  </div>
</body>
</html>
