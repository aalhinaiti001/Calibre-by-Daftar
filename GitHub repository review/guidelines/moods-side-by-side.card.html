<!-- @dsCard group="Colors" viewport="700x230" name="Same UI, both moods" subtitle="One markup, re-skinned by data-mood." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);display:flex;}
  .pane{flex:1;padding:22px;background:var(--color-bg);}
  .eyebrow{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);font-weight:700;color:var(--color-warm);}
  .card{margin-top:12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-card);}
  h3{font-family:var(--font-display);color:var(--color-text);margin:0 0 6px;font-size:20px;}
  p{color:var(--color-text-muted);font-size:12px;margin:0 0 12px;line-height:1.5;}
  .btn{display:inline-block;background:var(--color-accent);color:var(--color-on-accent);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:9px 16px;border-radius:var(--radius-md);}
  .tag{font-size:10px;color:var(--color-text-muted);}
</style>
</head>
<body>
  <div class="pane" data-mood="ink">
    <div class="eyebrow">Ink</div>
    <div class="card"><h3>Same candidate, two readers</h3><p>One CV, two verdicts. The gap is the story.</p><span class="btn">Scope a call</span></div>
  </div>
  <div class="pane" data-mood="midnight">
    <div class="eyebrow">Midnight</div>
    <div class="card"><h3>Same candidate, two readers</h3><p>One CV, two verdicts. The gap is the story.</p><span class="btn">Scope a call</span></div>
  </div>
</body>
</html>
