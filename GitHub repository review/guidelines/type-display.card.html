<!DOCTYPE html>
<html lang="en" data-mood="ink">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-display);background:var(--color-bg);padding:24px;color:var(--color-text);}
  .h1{font-size:52px;font-weight:600;line-height:var(--lh-tight);letter-spacing:var(--tracking-tight);margin:0;}

</style>
</head>
<body>
  <p class="h1">Noisier than <em>you think.</em></p>
  <div class="meta">Lora · 600 / italic 500 · tracking −0.03em · line-height 1.08</div>
</body>
</html>
