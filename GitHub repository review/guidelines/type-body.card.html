<!-- @dsCard group="Type" viewport="700x230" name="Body, eyebrow & mono" subtitle="Plus Jakarta Sans UI + wide-tracked micro-labels." -->
<!DOCTYPE html>
<html lang="en" data-mood="ink">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);padding:24px;color:var(--color-text);}
  .eyebrow{font-size:var(--fs-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);font-weight:700;color:var(--color-warm);margin-bottom:10px;}
  .lede{font-family:var(--font-display);font-weight:300;font-size:var(--fs-lede);color:var(--color-text-muted);max-width:52ch;line-height:1.6;margin:0 0 14px;}
  .body{font-size:var(--fs-body);color:var(--color-text-muted);max-width:56ch;line-height:var(--lh-body);margin:0 0 14px;}
  .mono{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);}
</style>
</head>
<body>
  <div class="eyebrow">Hiring Noise Diagnostic</div>
  <p class="lede">Serif lede, light weight — the editorial voice for intros and pull quotes.</p>
  <p class="body">Sans body at 16px / 1.7 for running copy. Muted foreground keeps long passages calm and readable across both moods.</p>
  <div class="mono">Δ 41 pts · CV-0418 · mono for data & labels</div>
</body>
</html>
