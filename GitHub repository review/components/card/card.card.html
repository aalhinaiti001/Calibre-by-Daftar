<!-- @dsCard group="Components" viewport="700x280" name="Card" subtitle="Bento surface, standard + highlight" -->
<!DOCTYPE html>
<html lang="en" data-mood="ink">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .card{display:flex;flex-direction:column;justify-content:space-between;gap:24px;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow-sm);}
  .std{background:var(--color-surface);}
  .hi{background:var(--color-accent-soft);}
  .num{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:30px;color:var(--color-text-muted);opacity:.6;margin-bottom:10px;}
  .hi .num{color:var(--color-accent);opacity:.5;}
  h3{font-size:18px;font-weight:700;color:var(--color-text);margin:0 0 10px;}
  .hi h3{color:var(--color-accent);}
  p{font-family:var(--font-display);font-size:13px;line-height:1.6;color:var(--color-text-muted);margin:0;}
  .meta{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--color-accent);}
</style>
</head>
<body>
  <div class="card std"><div><div class="num">I.</div><h3>Role-specific scorecard</h3><p>What "good" means for this role, written down — the standard every reviewer scores against.</p></div><span class="meta">Weighted • Defensible</span></div>
  <div class="card hi"><div><div class="num">VI.</div><h3>One-page findings memo</h3><p>A defensible record of what changed and why, plus a clear recommendation on scale.</p></div><span class="meta">Recommendation</span></div>
</body>
</html>
