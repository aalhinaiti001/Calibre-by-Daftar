<!-- @dsCard group="Components" viewport="700x180" name="SegmentedControl" subtitle="The Feel-panel switch, both moods" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);display:flex;}
  .pane{flex:1;padding:26px;background:var(--color-bg);}
  .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--color-text-muted);margin-bottom:8px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;border:1px solid var(--color-border);background:var(--color-surface-alt);color:var(--color-text);border-radius:var(--radius-md);padding:9px 6px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-sans);}
  .seg button.on{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent);}
</style>
</head>
<body>
  <div class="pane" data-mood="ink">
    <div class="lbl">Mood</div>
    <div class="seg"><button class="on">Ink</button><button>Midnight</button></div>
  </div>
  <div class="pane" data-mood="midnight">
    <div class="lbl">Density</div>
    <div class="seg"><button>Airy</button><button class="on">Standard</button><button>Compact</button></div>
  </div>
</body>
</html>
