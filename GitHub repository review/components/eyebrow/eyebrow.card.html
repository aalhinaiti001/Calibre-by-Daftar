<!DOCTYPE html>
<html lang="en" data-mood="ink">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);padding:28px;display:flex;flex-direction:column;gap:18px;}
  .eb{display:inline-flex;align-items:center;gap:.75rem;font-size:var(--fs-eyebrow);font-weight:700;text-transform:uppercase;letter-spacing:var(--tracking-eyebrow);}
  .warm{color:var(--color-warm);}
  .accent{color:var(--color-accent);}
  .rule{height:1px;width:2rem;background:currentColor;}
</style>
</head>
<body>
  <span class="eb warm"><span class="rule"></span>Hiring Noise Diagnostic</span>
  <span class="eb accent">What Leaves the Room</span>
  <span class="eb warm">Who It's For</span>
</body>
</html>
