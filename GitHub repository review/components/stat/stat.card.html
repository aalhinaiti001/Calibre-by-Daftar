<!-- @dsCard group="Components" viewport="700x150" name="StatBlock" subtitle="Serif figure + mono caption" -->
<!DOCTYPE html>
<html lang="en" data-mood="ink">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--color-bg);padding:28px;}
  .row{display:grid;grid-template-columns:repeat(3,auto);gap:2.5rem;border-top:1px solid var(--color-border);padding-top:1.25rem;justify-content:start;}
  .val{display:block;font-family:var(--font-display);font-weight:700;font-size:1.4rem;color:var(--color-accent);}
  .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--color-text-muted);}
</style>
</head>
<body>
  <div class="row">
    <div><span class="val">Δ 41 pts</span><span class="lbl">Typical reader gap</span></div>
    <div><span class="val">1 role</span><span class="lbl">To start</span></div>
    <div><span class="val">Fixed fee</span><span class="lbl">Scoped up front</span></div>
  </div>
</body>
</html>
