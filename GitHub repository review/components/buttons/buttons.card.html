<!-- @dsCard group="Components" viewport="700x180" name="Button" subtitle="primary · dark · ghost, two moods" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);display:flex;}
  .pane{flex:1;padding:26px;background:var(--color-bg);display:flex;flex-direction:column;gap:14px;}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--color-warm);}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-sans);font-weight:600;font-size:.8125rem;padding:14px 26px;border-radius:var(--radius-md);border:1px solid transparent;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
  .primary{background:var(--color-accent);color:var(--color-on-accent);}
  .dark{background:var(--color-footer);color:#fff;text-transform:none;letter-spacing:0;}
  .ghost{background:transparent;color:var(--color-text);border-color:var(--color-border);}
  .sm{padding:9px 16px;font-size:.6875rem;}
</style>
</head>
<body>
  <div class="pane" data-mood="ink">
    <div class="lbl">Ink</div>
    <div class="row"><span class="btn primary">Scope a call</span><span class="btn dark">Diagnose one role</span><span class="btn ghost">See the method</span><span class="btn primary sm">Small</span></div>
  </div>
  <div class="pane" data-mood="midnight">
    <div class="lbl">Midnight</div>
    <div class="row"><span class="btn primary">Scope a call</span><span class="btn dark">Diagnose one role</span><span class="btn ghost">See the method</span><span class="btn primary sm">Small</span></div>
  </div>
</body>
</html>
