<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Calibre by Daftar</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="icon" href="favicon-16.png" sizes="16x16">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#265147">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root{
      --paper:#FAF8F5; --paper-2:#F3EFE9; --ink:#121715; --ink-soft:#5c6360;
      --forest:#265147; --forest-700:#1c3d35; --clay:#B25B3C; --rule:#e6e0d7;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background:var(--paper); color:var(--ink);
      font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background-image:radial-gradient(circle at 50% -10%, rgba(38,81,71,.05), transparent 55%);
    }
    .nf{max-width:600px; margin:0 auto; padding:64px 32px; text-align:center}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--clay); margin-bottom:22px}
    h1{font-family:'Lora',Georgia,serif; font-weight:600; font-style:italic;
      font-size:clamp(30px,5vw,46px); line-height:1.08; letter-spacing:-.01em; margin:0 0 16px}
    p{font-size:17px; line-height:1.6; color:var(--ink-soft); margin:0 auto 32px; max-width:44ch}
    .cta{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
      background:var(--ink); color:var(--paper); font-weight:600; font-size:15px;
      padding:13px 22px; border-radius:9px; transition:background .2s ease}
    .cta:hover{background:var(--forest)}
    .cta:focus-visible{outline:2px solid var(--clay); outline-offset:2px}
  </style>
</head>
<body>
  <main class="nf">
    <div class="mono">Error 404 · CV-not-found</div>
    <h1>This page didn't make the shortlist.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to something that does.</p>
    <a href="./" class="cta">← Back to Calibre</a>
  </main>
</body>
</html>
